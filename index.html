<!doctype html><html lang="ko"><meta charset="utf-8"><title>MetaSonGi RAG Lab</title><style>body{margin:0;background:#0d1220;color:#e9efff;font:16px system-ui}main{max-width:1000px;margin:40px auto;padding:24px}h1{color:#68e4cf}section{background:#192238;padding:24px;border-radius:16px;margin:16px 0}button,input,textarea,select{font:inherit;padding:10px;border-radius:8px;margin:6px}button{background:#68e4cf;border:0;cursor:pointer}textarea{width:90%;min-height:100px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#68e4cf}.muted{color:#a6b4d0}</style><main><h1>MetaSonGi RAG Lab</h1><p class="muted">해시 기반 문자 임베딩 + SQLite 벡터 검색. Ollama 모델 설정 시 LLM 답변까지 실행합니다.</p><section><input id="source" value="robot-manual"><textarea id="doc">로봇의 관절 좌표는 각 관절의 회전각을 나타냅니다. 작업 좌표는 로봇 도구 끝단의 위치와 방향을 나타냅니다. 비상정지는 물리 장치를 별도로 사용합니다.</textarea><input id="file" type="file" accept=".txt,.md"><button id="ingest">문서 색인</button></section><section><input id="question" value="작업 좌표는 무엇인가요?"><label>Top-K <input id="k" type="number" min="1" max="10" value="3"></label><button id="ask">검색 → 답변</button><pre id="answer"></pre><div id="hits"></div></section><pre id="status"></pre></main><script>
const $=id=>document.getElementById(id);async function api(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error);return j}
$('file').onchange=async e=>{let f=e.target.files[0];if(f){$('doc').value=await f.text();$('source').value=f.name}};
$('ingest').onclick=async()=>{try{$('status').textContent=JSON.stringify(await api('/api/ingest',{source:$('source').value,text:$('doc').value}))}catch(e){$('status').textContent=e.message}};
$('ask').onclick=async()=>{let b=$('ask');b.disabled=true;try{let j=await api('/api/ask',{question:$('question').value,k:Number($('k').value)});$('answer').textContent=j.mode+'\n'+j.answer;$('hits').replaceChildren();for(let h of j.hits){let p=document.createElement('pre');p.textContent=`[${h.id}] ${h.source} #${h.part} · ${h.score.toFixed(3)}\n${h.text}`;$('hits').append(p)}}catch(e){$('answer').textContent=e.message}finally{b.disabled=false}};
fetch('/api/status').then(r=>r.json()).then(j=>$('status').textContent=JSON.stringify(j,null,2));
</script></html>
